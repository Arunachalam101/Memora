{% extends "base.html" %}

{% block title %}Memory Match Game - Memora{% endblock %}

{% block content %}
<div class="container game-container">
    <div class="game-header">
        <h1 data-i18n-key="game_memory_match_heading">🧠 Memory Match</h1>
        <div class="difficulty-badge" id="difficulty-badge" data-i18n-key="difficulty_loading">🟡 Loading...</div>
        <div class="game-stats">
            <div class="stat">
                <span class="stat-label" data-i18n-key="stat_moves">Moves:</span>
                <span class="stat-value" id="moves-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label" data-i18n-key="stat_time">Time:</span>
                <span class="stat-value" id="time-count">0:00</span>
            </div>
            <div class="stat">
                <span class="stat-label" data-i18n-key="stat_pairs">Pairs:</span>
                <span class="stat-value" id="pairs-count">0/6</span>
            </div>
        </div>
    </div>
    
    <div class="game-board" id="game-board"></div>
    
    <div id="completion-screen" class="completion-screen" style="display: none;">
        <div class="completion-card">
            <h2 data-i18n-key="completion_well_done">🎉 Well Done!</h2>
            <div class="score-display">
                <div class="score-item">
                    <span class="score-label" data-i18n-key="score_label">Score</span>
                    <span class="score-value" id="final-score">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label" data-i18n-key="accuracy_label">Accuracy</span>
                    <span class="score-value" id="final-accuracy">0%</span>
                </div>
                <div class="score-item">
                    <span class="score-label" data-i18n-key="time_label">Time</span>
                    <span class="score-value" id="final-time">0:00</span>
                </div>
            </div>
            <button class="btn btn-primary btn-large" onclick="goToGamesHub()" data-i18n-key="btn_back_to_games">Back to Games</button>
        </div>
    </div>
</div>

<script>
    // Pass user_id from Flask session to JavaScript
    const USER_ID = {{ session.get('user_id', 'null') }};
</script>
<script src="{{ url_for('static', filename='js/memory_match.js') }}"></script>
{% endblock %}
